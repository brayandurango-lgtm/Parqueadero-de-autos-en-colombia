name: CI - Verificación

# Solo verificación: compila, prueba y guarda el reporte de cobertura como artefacto.
# NO construye ni publica imágenes Docker, NO despliega, NO usa GHCR.
# La publicación de imágenes queda fuera de esta fase (todavía no existe release.yml).

on:
  push:
    branches: [ main, Urrea ]
  pull_request:
    branches: [ main ]

# Permisos mínimos. `actions: write` es el ámbito que necesita upload-artifact para publicar
# artefactos del propio run; sigue sin otorgar permisos sobre el contenido del repositorio
# ni sobre registros de paquetes.
permissions:
  contents: read
  actions: write

jobs:
  verify:
    name: Verificar backend y frontend
    runs-on: ubuntu-latest

    concurrency:
      group: verify-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # `mvn verify` ya genera el reporte de JaCoCo porque el plugin enlaza el goal `report`
      # a la fase `test` (ver pom.xml), así que se eliminó el segundo paso `mvn jacoco:report`
      # y el `mvn package -DskipTests` del job de imagen.
      # Las pruebas corren aisladas en H2 en memoria con el perfil `test`, por lo que no
      # necesitan DB_PASSWORD ni JWT_SECRET de operación (verificado en local: la suite pasa
      # con esas variables sin definir).
      - name: Pruebas del backend, empaquetado y cobertura
        run: mvn -B clean verify

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          # Requisito real medido en el proyecto: src/test/js/app.test.js es CommonJS y usa el
          # runner nativo (`node:test`, `node:assert/strict`, `node:vm`) sin package.json ni
          # dependencias npm. Ese runner es estable desde Node 20. Se fija la familia usada y
          # verificada en local (v26.7.0).
          node-version: '26'

      - name: Pruebas del frontend estático
        run: node --test src/test/js/app.test.js

      - name: Subir reporte de JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: warn
